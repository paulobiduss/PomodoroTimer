name: Release

# Dispara quando uma tag no formato vX.Y.Z e enviada (ex: v1.0.0).
# Compila o app nos runners Windows e macOS (PyInstaller nao faz cross-compile)
# e publica um GitHub Release com os dois pacotes anexados.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # necessario para o job "release" criar o GitHub Release

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ---------------------------------------------------------------------------
  # Windows: gera o pacote portatil (.zip com o PomodoroTimer.exe)
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependencias
        run: pip install PyQt6==6.11.0 pyinstaller==6.20.0 Pillow

      - name: Gerar icone .ico
        run: |
          python -c "from PIL import Image; Image.open('assets/icon.png').convert('RGBA').save('icon.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: Build com PyInstaller
        run: >
          pyinstaller -y --clean --onedir --windowed
          --name PomodoroTimer
          --icon icon.ico
          --add-data "assets;assets"
          --hidden-import PyQt6.QtCore
          --hidden-import PyQt6.QtGui
          --hidden-import PyQt6.QtSvg
          --hidden-import PyQt6.QtWidgets
          --hidden-import PyQt6.sip
          main.py

      - name: Copiar docs para o pacote
        run: |
          Copy-Item README.md    dist/PomodoroTimer/README.md
          Copy-Item LICENSE      dist/PomodoroTimer/LICENSE
          Copy-Item CHANGELOG.md dist/PomodoroTimer/CHANGELOG.md

      - name: Gerar .zip portatil
        run: Compress-Archive -Path dist/PomodoroTimer -DestinationPath "PomodoroTimer-${{ github.ref_name }}-windows-portable.zip" -Force

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: PomodoroTimer-${{ github.ref_name }}-windows-portable.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS: gera o PomodoroTimer.app e empacota em um instalador .dmg
  # ---------------------------------------------------------------------------
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependencias
        run: pip install PyQt6==6.11.0 pyinstaller==6.20.0 Pillow

      - name: Gerar icone .icns
        run: |
          set -e
          # Normaliza o icon.png (que na verdade e um JPEG) para PNG quadrado.
          sips -s format png assets/icon.png --out icon_src.png
          mkdir -p icon.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size icon_src.png --out "icon.iconset/icon_${size}x${size}.png"
            double=$((size * 2))
            sips -z $double $double icon_src.png --out "icon.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns icon.iconset -o icon.icns

      - name: Build com PyInstaller
        run: >
          pyinstaller -y --clean --onedir --windowed
          --name PomodoroTimer
          --icon icon.icns
          --add-data "assets:assets"
          --hidden-import PyQt6.QtCore
          --hidden-import PyQt6.QtGui
          --hidden-import PyQt6.QtSvg
          --hidden-import PyQt6.QtWidgets
          --hidden-import PyQt6.sip
          main.py

      - name: Empacotar .dmg
        run: |
          set -e
          mkdir -p dmg_staging
          cp -R "dist/PomodoroTimer.app" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create \
            -volname PomodoroTimer \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            "PomodoroTimer-${{ github.ref_name }}-macos.dmg"

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: PomodoroTimer-${{ github.ref_name }}-macos.dmg
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Release: baixa os dois pacotes e cria o GitHub Release da tag
  # ---------------------------------------------------------------------------
  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    steps:
      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PomodoroTimer ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/PomodoroTimer-${{ github.ref_name }}-windows-portable.zip
            artifacts/PomodoroTimer-${{ github.ref_name }}-macos.dmg
